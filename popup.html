<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>MailSafe</title>
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <div class="title">MailSafe</div>
        <div id="subtitle" class="subtitle">On-demand Analysis</div>
      </div>

      <button id="analyzeBtn" class="btn">Analyze this email</button>

      <div class="upload">
        <label id="uploadLabel" class="uploadLabel">or analyze .eml file</label>
        <input id="emlFile" type="file" accept=".eml,message/rfc822" />
      </div>

      <div id="status" class="status hidden">
        <div id="statusText" class="statusText"></div>
        <div id="verdictPill" class="pill">—</div>
        <div id="reason1" class="reason"></div>
        <div id="reason2" class="reason"></div>

        <details class="details">
          <summary id="detailsSummary">View diagnostic details</summary>
          <div class="findingsBlock">
            <div id="signalsTitle" class="sectionTitle">Detected signals</div>
            <ul id="findingsList" class="findingsList"></ul>
          </div>
          <div class="kv"><span id="providerLabel">Provider:</span> <span id="provider">—</span></div>
          <div class="kv"><span id="senderDomainLabel">Sender domain:</span> <span id="senderDomain">—</span></div>
          <div class="kv"><span id="linkDomainsLabel">Link domains:</span> <span id="linkDomains">—</span></div>
        </details>
      </div>

      <div id="hint" class="hint">
        Open an email in Gmail or Outlook Web and press "Analyze".
      </div>

      <div id="error" class="error hidden"></div>

      <div class="langSelector">
        <select id="langSelect">
          <option value="en">English</option>
          <option value="es">Español</option>
        </select>
      </div>
    </div>

    <script src="i18n.js"></script>
    <script src="linkNormalizer.js"></script>
    <script src="analysis.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
